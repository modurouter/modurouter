[project]
name = "modurouter"
version = "0.1.0"
description = "Korean AI harness with bounded OpenRouter routing"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn[standard]>=0.41,<1",
  "sqlalchemy[asyncio]>=2.0.48,<2.1",
  "asyncmy>=0.2.11,<0.3",
  "alembic>=1.18,<2",
  "pydantic-settings>=2.13,<3",
  "httpx>=0.28,<1",
  "authlib>=1.6.9,<2",
  "joserfc>=1.7,<2",
  "itsdangerous>=2.2,<3",
  "python-multipart>=0.0.22,<1",
  "pypdf>=6,<7",
  "pillow>=12,<13",
  "python-magic>=0.4.27,<0.5",
  "charset-normalizer>=3.4,<4",
  "beautifulsoup4>=4.14,<5",
  "aiohttp>=3.13,<4",
  "olefile>=0.47,<0.48",
  "defusedxml>=0.7.1,<0.8",
  "cryptography>=46,<51",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
  "python-pptx>=1,<2",
  "pypdfium2>=5,<6",
]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.3,<2", "ruff>=0.15,<1", "aiosqlite>=0.22,<1", "paramiko>=5,<6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/modurouter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Form", "fastapi.Header"]
